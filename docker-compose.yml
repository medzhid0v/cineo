## Cineo — запуск из готового образа (GHCR). Локальная сборка не нужна.
##   1) cp .env.example .env  и заполните значения
##   2) docker compose up -d
## Закрепить версию: CINEO_TAG=v0.1.0 в .env (по умолчанию latest).

x-app-base: &app-base
  image: ghcr.io/medzhid0v/cineo:${CINEO_TAG:-latest}
  env_file:
    - .env
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_started

services:
  web:
    <<: *app-base
    ports:
      - "8000:8000"
    command: >
      gunicorn core.wsgi:application
      --bind 0.0.0.0:8000
      --workers 2
      --threads 4
      --timeout 60
      --access-logfile -
      --error-logfile -
      --log-level info

  celery:
    <<: *app-base
    container_name: cineo-celery
    command: celery -A core worker -l info

  postgres:
    container_name: cineo-postgres
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cineo
      POSTGRES_USER: cineo
      POSTGRES_PASSWORD: cineo
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cineo -d cineo"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    container_name: cineo-redis
    image: redis:7-alpine
    restart: unless-stopped

volumes:
  postgres_data:
